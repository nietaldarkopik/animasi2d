# nginx site for a server WITHOUT Docker (php-fpm on the same host).
# Frontend build:   cd frontend && npm ci && npm run build   ->  /var/www/cartoon-maker/frontend/dist
# Put TLS in front (certbot / your load balancer) and set APP_URL=https://... and TRUSTED_PROXIES in backend/.env.
server {
    listen 80;
    server_name studio.example.com;

    client_max_body_size 530m;
    client_body_timeout 300s;

    root /var/www/cartoon-maker/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/cartoon-maker/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cartoon-maker/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/cartoon-maker/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/cartoon-maker/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # "expires", not "add_header", inside locations (see deploy/nginx/default.conf)
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri /index.html;
    }

    # never serve dotfiles (.env) even if the document root is misconfigured
    location ~ /\. { deny all; }
}
