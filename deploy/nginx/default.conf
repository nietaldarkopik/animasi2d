server {
    listen 80;
    server_name _;

    # export recordings are uploaded in one request (see php.ini)
    client_max_body_size 530m;
    client_body_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + health check -> Laravel (php-fpm). No try_files: the front controller path is fixed.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_request_buffering on;
    }
    location = /up {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # hashed build output: cache for a year. NOTE: use "expires", not "add_header", inside locations: a location that
    # defines its own add_header silently drops the server-level security headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # single-page app: any other path is handled by the router
    location / {
        expires -1;   # index.html must always be revalidated so users get new builds
        try_files $uri /index.html;
    }
}